spring.application.name=customer
# jwts.security=c0Vx4miaLifx7BcjN06UReYicfSpta7xeiMOmWEwOZs=
# server.port=8082
jwts.security=${JWTS_SECURITY}
server.port=${PORT:8082}

spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.url=jdbc:postgresql://localhost:5432/customer
# spring.datasource.username=postgres
# spring.datasource.password=postgres30082004
spring.datasource.url=${URL}
spring.datasource.username=${USERNAME}
spring.datasource.password=${PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.service-url.defaultZone=http://service:8761/eureka
eureka.instance.prefer-ip-address=true